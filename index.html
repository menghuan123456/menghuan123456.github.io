<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>蝶梦星辰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: radial-gradient(ellipse at center, #0a0e2a 0%, #000000 100%);
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
        .title {
            position: fixed;
            top: 5vh;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.85);
            font-size: 22px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 15px rgba(136, 101, 204, 0.8);
        }
    </style>
</head>
<body>
    <div class="title">蝶梦星辰 · Butterfly Dream</div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        // 基础渲染系统
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x050718, 20, 60);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 28);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // ============= 灯光系统（梦幻光影）=============
        const ambientLight = new THREE.AmbientLight(0x4a3d7a, 0.4);
        scene.add(ambientLight);

        const light1 = new THREE.PointLight(0x9f7aea, 1.8, 30);
        light1.position.set(10, 5, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xe684c8, 1.6, 25);
        light2.position.set(-10, -5, 8);
        scene.add(light2);

        // ============= 星空星云粒子 =============
        function createStarField() {
            const starGeo = new THREE.BufferGeometry();
            const count = 1600;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                positions[i*3] = (Math.random() - 0.5) * 600;
                positions[i*3+1] = (Math.random() - 0.5) * 400;
                positions[i*3+2] = (Math.random() - 0.5) * 600;
                
                const mix = Math.random();
                if(mix > 0.85) {
                    colors[i*3] = 1; colors[i*3+1] = 0.8; colors[i*3+2] = 1;
                } else if(mix > 0.6) {
                    colors[i*3] = 0.7; colors[i*3+1] = 0.6; colors[i*3+2] = 1;
                } else {
                    colors[i*3] = 0.5; colors[i*3+1] = 0.5; colors[i*3+2] = 0.9;
                }
                sizes[i] = Math.random() * 2.8 + 0.4;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            starGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const starMat = new THREE.PointsMaterial({
                size: 1, transparent: true, opacity: 0.92,
                vertexColors: true, blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });
            return new THREE.Points(starGeo, starMat);
        }
        const stars = createStarField();
        scene.add(stars);

        // ============= 高级水晶蝴蝶 =============
        function createCrystalButterfly() {
            const butterfly = new THREE.Group();
            
            // 身体
            const bodyGeo = new THREE.CylinderGeometry(0.22, 0.26, 4.2, 12);
            const bodyMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, metalness: 1, roughness: 0,
                transparent: true, opacity: 0.9,
                ior: 1.8, thickness: 2
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            butterfly.add(body);

            // 翅膀材质（水晶流光）
            const wingMat = new THREE.MeshPhysicalMaterial({
                color: 0xf8f4ff,
                metalness: 0, roughness: 0,
                transparent: true, opacity: 0.45,
                transmission: 0.9, thickness: 1.5,
                ior: 1.6, side: THREE.DoubleSide
            });

            // 左前翅
            const lfWing = new THREE.Mesh(new THREE.PlaneGeometry(9, 5.5), wingMat);
            lfWing.position.set(-4.2, 1, 0);
            lfWing.rotation.z = Math.PI / 5;
            butterfly.add(lfWing);

            // 右前翅
            const rfWing = new THREE.Mesh(new THREE.PlaneGeometry(9, 5.5), wingMat);
            rfWing.position.set(4.2, 1, 0);
            rfWing.rotation.z = -Math.PI / 5;
            butterfly.add(rfWing);

            // 左后翅
            const lbWing = new THREE.Mesh(new THREE.PlaneGeometry(7, 4.5), wingMat);
            lbWing.position.set(-3.5, -1.5, 0);
            lbWing.rotation.z = Math.PI / 6;
            butterfly.add(lbWing);

            // 右后翅
            const rbWing = new THREE.Mesh(new THREE.PlaneGeometry(7, 4.5), wingMat);
            rbWing.position.set(3.5, -1.5, 0);
            rbWing.rotation.z = -Math.PI / 6;
            butterfly.add(rbWing);

            // 触角
            const antGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.4, 6);
            const ant1 = new THREE.Mesh(antGeo, bodyMat);
            ant1.position.set(-0.5, 2.8, 0);
            ant1.rotation.z = Math.PI / 5;
            butterfly.add(ant1);

            const ant2 = new THREE.Mesh(antGeo, bodyMat);
            ant2.position.set(0.5, 2.8, 0);
            ant2.rotation.z = -Math.PI / 5;
            butterfly.add(ant2);

            butterfly.position.set(0, 0, -15);
            return butterfly;
        }
        const butterfly = createCrystalButterfly();
        scene.add(butterfly);

        // ============= 动画系统 =============
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;

            // 翅膀扇动
            const flap = Math.sin(time * 6) * 0.55;
            butterfly.children[1].rotation.z = Math.PI / 5 + flap;
            butterfly.children[2].rotation.z = -Math.PI / 5 - flap;
            butterfly.children[3].rotation.z = Math.PI / 6 + flap * 0.7;
            butterfly.children[4].rotation.z = -Math.PI / 6 - flap * 0.7;

            // 蝴蝶飘逸动画
            butterfly.position.y = Math.sin(time * 1.2) * 2.2;
            butterfly.rotation.y = Math.sin(time * 0.4) * 0.35;
            butterfly.rotation.x = Math.sin(time * 0.3) * 0.15;

            // 星空旋转
            stars.rotation.y += 0.0012;
            stars.rotation.x += 0.0005;

            // 光影呼吸
            light1.intensity = 1.8 + Math.sin(time * 1.5) * 0.4;
            light2.intensity = 1.6 + Math.sin(time * 1.7) * 0.5;

            renderer.render(scene, camera);
        }
        animate();

        // ============= 移动端触摸交互 =============
        let mouseX = 0, mouseY = 0;
        document.addEventListener('touchmove', (e) => {
            const x = e.touches[0].clientX / window.innerWidth - 0.5;
            const y = e.touches[0].clientY / window.innerHeight - 0.5;
            mouseX = x * 2.5;
            mouseY = y * 2;
        });

        function updateCamera() {
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(0,0,-10);
            requestAnimationFrame(updateCamera);
        }
        updateCamera();

        // ============= 响应式 =============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

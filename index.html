<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>女神节快乐</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #160016;
      }
      @import 'https://fonts.googleapis.com/css2?family=Megrim&display=swap';
      #word {
        font-family: Megrim, cursive;
        font-size: 20vh;
        position: absolute;
        margin: 10;
        color: #fc0;
        -webkit-text-stroke: 0.15vh #c0f;
      }
    </style>
  </head>
  <body>
    <div id="word">Happy</div>
    <script type="module">
      import * as THREE from 'https://cdn.skypack.dev/three@0.136.0'
      import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls'

      console.clear()

      let scene = new THREE.Scene()
      scene.background = new THREE.Color(0x160016)
      let camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 1000)
      let renderer = new THREE.WebGLRenderer({ antialias: true })
      camera.position.set(0, 0, 300)
      renderer.setSize(innerWidth, innerHeight)
      document.body.appendChild(renderer.domElement)
      const loader = new THREE.TextureLoader()
      loader.load(
        './back.jpg', // 等矩形全景图
        (texture) => {
          scene.background = texture
        },
      )

      // 自适应屏幕，球体永远不超出浏览器边界
      let fitToScreen = () => {
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
        let minDim = Math.min(innerWidth, innerHeight)
        camera.position.z = minDim < 500 ? 18 : 16
      }
      window.addEventListener('resize', fitToScreen)
      fitToScreen()

      let controls = new OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      controls.enablePan = false

      let gu = { time: { value: 0 } }
      let clock = new THREE.Clock()
      let totalTime = 0
      const CYCLE = 60

      let sizes = [],
        shift = [],
        originalPositions = [],
        heartPositions = []
      let pushShift = () => {
        shift.push(
          Math.random() * Math.PI,
          Math.random() * Math.PI * 2,
          (Math.random() * 0.9 + 0.1) * Math.PI * 0.1,
          Math.random() * 0.9 + 0.1,
        )
      }

      // 生成安全球体（永远不超出屏幕）
      let pts = []
      const SPHERE_SIZE = 6.5
      for (let i = 0; i < 60000; i++) {
        let p = new THREE.Vector3()
          .randomDirection()
          .multiplyScalar(Math.random() * 0.2 + SPHERE_SIZE)
        pts.push(p)
        originalPositions.push(p.clone())
        sizes.push(Math.random() * 1.2 + 0.4)
        pushShift()
      }

      // 生成【原球体60%大小】实心3D爱心
      const HEART_SCALE = 0.6
      for (let i = 0; i < pts.length; i++) {
        let angle = Math.random() * Math.PI * 2
        let radius = Math.random()
        let x = 16 * Math.sin(angle) ** 3 * radius
        let y =
          -(
            13 * Math.cos(angle) -
            5 * Math.cos(2 * angle) -
            2 * Math.cos(3 * angle) -
            Math.cos(4 * angle)
          ) * radius
        let z = (Math.random() - 0.5) * 3.5 * radius
        heartPositions.push(new THREE.Vector3(x, y, z).multiplyScalar(HEART_SCALE))
      }

      let g = new THREE.BufferGeometry().setFromPoints(pts)
      g.setAttribute('sizes', new THREE.Float32BufferAttribute(sizes, 1))
      g.setAttribute('shift', new THREE.Float32BufferAttribute(shift, 4))

      let m = new THREE.PointsMaterial({
        size: 0.11,
        transparent: true,
        depthTest: false,
        blending: THREE.AdditiveBlending,
        onBeforeCompile: (shader) => {
          shader.uniforms.time = gu.time
          shader.vertexShader = `
          uniform float time;
          attribute float sizes;
          attribute vec4 shift;
          varying vec3 vColor;
          ${shader.vertexShader}
        `
            .replace(`gl_PointSize = size;`, `gl_PointSize = size * sizes;`)
            .replace(
              `#include <color_vertex>`,
              `#include <color_vertex>
            float d = length(abs(position) / vec3(40., 10., 40));
            d = clamp(d, 0., 1.);
            vColor = mix(vec3(227., 155., 0.), vec3(100., 50., 255.), d) / 255.;
          `,
            )
            .replace(
              `#include <begin_vertex>`,
              `#include <begin_vertex>
            float t = time;
            float moveT = mod(shift.x + shift.z * t, PI2);
            float moveS = mod(shift.y + shift.z * t, PI2);
            transformed += vec3(cos(moveS) * sin(moveT), cos(moveT), sin(moveS) * sin(moveT)) * shift.w;
          `,
            )
          shader.fragmentShader = `
          varying vec3 vColor;
          ${shader.fragmentShader}
        `
            .replace(
              `#include <clipping_planes_fragment>`,
              `#include <clipping_planes_fragment>
            float d = length(gl_PointCoord.xy - 0.5);
            if (d > 0.5) discard;
          `,
            )
            .replace(
              `vec4 diffuseColor = vec4( diffuse, opacity );`,
              `vec4 diffuseColor = vec4( vColor, smoothstep(0.5, 0.15, d) );`,
            )
        },
      })

      let p = new THREE.Points(g, m)
      p.rotation.order = 'ZYX'
      p.rotation.z = 0.2
      scene.add(p)

      const positionsArray = g.attributes.position.array

      // 丝滑缓动函数
      function easeInOutSine(x) {
        return -(Math.cos(Math.PI * x) - 1) / 2
      }

      renderer.setAnimationLoop(() => {
        controls.update()
        let dt = clock.getDelta()
        totalTime += dt
        let t = clock.getElapsedTime() * 0.5
        gu.time.value = t * Math.PI
        let cycleTime = totalTime % CYCLE
        p.scale.set(1, 1, 1)

        // ===================== 旋转控制 =====================
        if ((cycleTime >= 0 && cycleTime < 10) || (cycleTime >= 50 && cycleTime < 60)) {
          p.rotation.y = t * 0.05
        } else {
          p.rotation.y = 0
        }

        // ===================== 核心动画时间轴 =====================
        if (cycleTime >= 10 && cycleTime < 30) {
          // 10-30s：丝滑收缩成 60% 实心3D爱心
          let progress = easeInOutSine(Math.min((cycleTime - 10) / 20, 1))
          for (let i = 0; i < pts.length; i++) {
            positionsArray[i * 3] = THREE.MathUtils.lerp(
              originalPositions[i].x,
              heartPositions[i].x,
              progress,
            )
            positionsArray[i * 3 + 1] = THREE.MathUtils.lerp(
              originalPositions[i].y,
              heartPositions[i].y,
              progress,
            )
            positionsArray[i * 3 + 2] = THREE.MathUtils.lerp(
              originalPositions[i].z,
              heartPositions[i].z,
              progress,
            )
          }
        } else if (cycleTime >= 30 && cycleTime < 45) {
          // 30-45s：保持心形 + 呼吸跳动
          for (let i = 0; i < pts.length; i++) {
            positionsArray[i * 3] = heartPositions[i].x
            positionsArray[i * 3 + 1] = heartPositions[i].y
            positionsArray[i * 3 + 2] = heartPositions[i].z
          }
          // 爱心呼吸缩放
          let pulse = Math.sin(t * 2.5) * 0.08 + 1
          p.scale.set(pulse, pulse, pulse)
        } else if (cycleTime >= 45 && cycleTime < 50) {
          // 45-50s：5秒平滑扩散回球体
          let progress = (cycleTime - 45) / 5
          let ease = easeInOutSine(progress)
          for (let i = 0; i < pts.length; i++) {
            positionsArray[i * 3] = THREE.MathUtils.lerp(
              positionsArray[i * 3],
              originalPositions[i].x,
              ease,
            )
            positionsArray[i * 3 + 1] = THREE.MathUtils.lerp(
              positionsArray[i * 3 + 1],
              originalPositions[i].y,
              ease,
            )
            positionsArray[i * 3 + 2] = THREE.MathUtils.lerp(
              positionsArray[i * 3 + 2],
              originalPositions[i].z,
              ease,
            )
          }
        } else {
          // 0-10 & 50-60：保持原始球体
          for (let i = 0; i < pts.length; i++) {
            positionsArray[i * 3] = originalPositions[i].x
            positionsArray[i * 3 + 1] = originalPositions[i].y
            positionsArray[i * 3 + 2] = originalPositions[i].z
          }
        }

        g.attributes.position.needsUpdate = true
        renderer.render(scene, camera)
      })
    </script>
  </body>
  <style>
    @import 'https://fonts.googleapis.com/css2?family=Megrim&display=swap';
    body {
      overflow: hidden;
      margin: 0;
    }
    #word {
      font-family: Megrim, cursive;
      font-size: 20vw;
      position: absolute;
      margin: 10;
      /*bottom: 0;*/
      color: #fc0;
      -webkit-text-stroke: 0.15vh #c0f;
    }
  </style>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女神节快乐</title>
    <style>
        body { margin: 0; overflow: hidden; background: #160016; }
        /* 女神节祝福文字 */
        .blessing {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff9ff3;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff9ff3;
            pointer-events: none;
            z-index: 999;
            letter-spacing: 2px;
            animation: glow 2s infinite alternate;
            font-family: "Microsoft YaHei", sans-serif;
        }
        @keyframes glow {
            from { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        }
    </style>
</head>
<body>
    <div class="blessing">祝 全 部 女 神 节 日 快 乐 🎀</div>

    <script type="module">
        import * as THREE from "https://cdn.skypack.dev/three@0.136.0";
        import {OrbitControls} from "https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls";

        console.clear();

        let scene = new THREE.Scene();
        scene.background = new THREE.Color(0x160016);
        let camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 1000);
        camera.position.set(0, 4, 21);
        let renderer = new THREE.WebGLenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);
        window.addEventListener("resize", event => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        })

        let controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;

        let gu = {
          time: {value: 0}
        }

        let sizes = [];
        let shift = [];
        let pushShift = () => {
          shift.push(
            Math.random() * Math.PI, 
            Math.random() * Math.PI * 2, 
            (Math.random() * 0.9 + 0.1) * Math.PI * 0.1,
            Math.random() * 0.9 + 0.1
          );
        }
        let pts = new Array(50000).fill().map(p => {
          sizes.push(Math.random() * 1.5 + 0.5);
          pushShift();
          return new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 0.5 + 9.5);
        })
        for(let i = 0; i < 100000; i++){
          let r = 10, R = 40;
          let rand = Math.pow(Math.random(), 1.5);
          let radius = Math.sqrt(R * R * rand + (1 - rand) * r * r);
          pts.push(new THREE.Vector3().setFromCylindricalCoords(radius, Math.random() * 2 * Math.PI, (Math.random() - 0.5) * 2 ));
          sizes.push(Math.random() * 1.5 + 0.5);
          pushShift();
        }

        let g = new THREE.BufferGeometry().setFromPoints(pts);
        g.setAttribute("sizes", new THREE.Float32BufferAttribute(sizes, 1));
        g.setAttribute("shift", new THREE.Float32BufferAttribute(shift, 4));
        let m = new THREE.PointsMaterial({
          size: 0.125,
          transparent: true,
          depthTest: false,
          blending: THREE.AdditiveBlending,
          onBeforeCompile: shader => {
            shader.uniforms.time = gu.time;
            shader.vertexShader = `
              uniform float time;
              attribute float sizes;
              attribute vec4 shift;
              varying vec3 vColor;
              ${shader.vertexShader}
            `.replace(
              `gl_PointSize = size;`,
              `gl_PointSize = size * sizes;`
            ).replace(
              `#include <color_vertex>`,
              `#include <color_vertex>
                float d = length(abs(position) / vec3(40., 10., 40));
                d = clamp(d, 0., 1.);
                // 女神节粉紫渐变配色
                vColor = mix(vec3(255., 159., 243.), vec3(104., 109., 224.), d) / 255.;
              `
            ).replace(
              `#include <begin_vertex>`,
              `#include <begin_vertex>
                float t = time;
                float moveT = mod(shift.x + shift.z * t, PI2);
                float moveS = mod(shift.y + shift.z * t, PI2);
                transformed += vec3(cos(moveS) * sin(moveT), cos(moveT), sin(moveS) * sin(moveT)) * shift.w;
              `
            );
            shader.fragmentShader = `
              varying vec3 vColor;
              ${shader.fragmentShader}
            `.replace(
              `#include <clipping_planes_fragment>`,
              `#include <clipping_planes_fragment>
                float d = length(gl_PointCoord.xy - 0.5);
              `
            ).replace(
              `vec4 diffuseColor = vec4( diffuse, opacity );`,
              `vec4 diffuseColor = vec4( vColor, smoothstep(0.5, 0.1, d) );`
            );
          }
        });
        let p = new THREE.Points(g, m);
        p.rotation.order = "ZYX";
        p.rotation.z = 0.2;
        scene.add(p)

        let clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
          controls.update();
          let t = clock.getElapsedTime() * 0.5;
          gu.time.value = t * Math.PI;
          p.rotation.y = t * 0.05;
          
          // ========== 核心新增：场景收缩跳动动画 ==========
          let pulse = Math.sin(t * 3) * 0.15 + 1; // 跳动频率
          p.scale.set(pulse, pulse, pulse);     // 整体缩放脉动
          camera.position.z = 21 + Math.sin(t * 2.5) * 1.2; // 镜头呼吸感
          
          renderer.render(scene, camera);
        });
    </script>
</body>
</html>
